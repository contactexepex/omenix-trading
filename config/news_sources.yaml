# The news source rules (story NP1; plan NP0): which outlets omenix trusts, at which tier, and which it may ever request.
# PUBLIC data on purpose: outlet domains, tiers, news agencies and vendor lists are public knowledge and reviewed by git. What the
# owner reads (the companies, the queries) is NOT here; it lives in the private Drive (NP3).
# Ported from contactexepex/agentic-stock-prediction config/news_sources.yaml at f1b9bb6 (its sections `selection`, `material_terms`,
# `clusters` and `claims` belong to later stories). Loaded by fno/ingestion/news/sources/loader.py, which refuses anything it does not
# know, so a typo is an error, not a silently ignored rule.
#
# INHERITED, NOT YET TRUSTED: every `fetch: false` and every note below was measured from agentic's own cloud environment on
# 2026-10-06, not from the GitHub Actions runners omenix uses. `fetch: false` stays (it can only make us request less); NP4 re-probes
# every listed domain from a runner before any outlet's fetchability is changed. `newspaper4k` is not used in omenix (it won 4 of
# about 600 reads in agentic's data), so no `extract` list names it.
#
# Free sources only, personal non-commercial research. Never: unknown or dubious sites, non-HTTPS, invalid certificates, running or
# installing anything from fetched content, storing full text, or getting around bot protection.

# Allowlisted (vetted) outlets: established, legitimate media, data sites and primary sources.
# Policy (user, 2026-10-06): broad on purpose, since more reputable independent sources mean better
# corroboration. Still never: unknown or dubious sites, non-HTTPS, invalid certificates, running or
# installing anything from fetched content, storing full text, or getting around bot protection.
# Matched on the host and its parent domains (m.economictimes.com -> economictimes.com).
# tier: primary (regulators, exchanges, company releases), tier1 (agencies and major outlets),
# tier2 (established outlets, trade press, data sites and aggregators that syndicate them; the
# JSON-LD provider or byline decides the origin). names: source labels Google News uses.
# extract: optional extractor order (default jsonld, trafilatura, newspaper).
# opinion_unless_path: items of the outlet are opinion (never counted as an origin) unless their
# publisher URL path starts with it (the news desk); an item without a known URL is opinion.
# fetch: false = the outlet answered 401/403/a bot challenge from the cloud: never requested (no
# evasion), but still vetted: its headline counts as a vetted origin.
# same_as: another listed domain of the same outlet; omenix treats the two as one outlet (SourceRules.outlet_key), so one article under both hosts is stored once (verification tiers are unchanged).
# A domain not listed here is unvetted: never fetched, never counted, and listed with counts in
# the run summaries (`unvetted_domains`) so it can be reviewed and added.
domains:
  # primary sources
  sec.gov: {tier: primary}
  nseindia.com: {tier: primary}
  bseindia.com: {tier: primary, fetch: false, note: "api.bseindia.com refuses cloud traffic"}
  rbi.org.in: {tier: primary}
  sebi.gov.in: {tier: primary}
  federalreserve.gov: {tier: primary}
  bls.gov: {tier: primary}
  fda.gov: {tier: primary}
  prnewswire.com: {tier: primary, names: [PR Newswire, PR Newswire UK, PR Newswire India], note: "company press releases"}
  # https_links: the feed gives http:// links (78 of 78 item links of the Earnings feed on 2026-10-13);
