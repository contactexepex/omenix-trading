# Story NP4a: one front-page request to each listed news outlet, from a GitHub runner, so the owner sees which outlets this
# network can really reach before any outlet is marked fetchable (docs/stories/NP4-page-reads.md). Manual only
# (workflow_dispatch): NO schedule. Read-only: it holds no secret, writes no file to Drive, commits nothing; the result is
# the log of this run (the allowlist is public, so a domain and a fixed result code are printed, nothing else).
# Without `include_refusing` the outlets marked fetch: false are not asked. Research data only; never places orders.
name: news-probe-outlets

on:
  workflow_dispatch:
    inputs:
      include_refusing:
        description: "Also look once at the outlets marked fetch: false (a report for the owner; the allowlist is not edited)."
        type: boolean
        default: false
      dry_run:
        description: "Validate runner + deps + CLI load; no request."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INCLUDE_REFUSING: ${{ inputs.include_refusing && '--include-refusing' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: DRY-RUN validation (no request; prove the CLI loads)
        if: ${{ inputs.dry_run }}
        run: python -m fno news probe-outlets --help
      - name: Probe the listed outlets
        if: ${{ !inputs.dry_run }}
        run: python -m fno news probe-outlets $INCLUDE_REFUSING
