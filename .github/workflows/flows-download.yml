# Story P8: the big investors' daily flows, downloaded as a plain scheduled job (no AI session: O6). NSE's provisional
# FII/FPI and DII cash-market values and NSDL's daily FPI report serve only their latest day, so each run archives that
# copy to the owner's Drive under the session it covers (with its SHA-256 manifest row, committed); history builds from
# the first copy, and a session keeps its first copy (the 07:10 IST publish run takes one too; judge 66). Research
# data only; it never trades. Secrets: the Drive and Slack ones the other jobs use; none is printed.
name: flows-download

on:
  schedule:
    - cron: "40 15 * * *" # 21:10 IST: after NSE's evening release of the day's provisional values
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate runner + deps + CLI load; write nothing to Drive, no commit, no Slack."
        type: boolean
        default: false

permissions:
  contents: write # commits the manifest rows (research/data/manifests/)

concurrency:
  group: flows-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: DRY-RUN validation (no Drive, no commit, no Slack; prove the CLI loads for each command)
        if: ${{ inputs.dry_run }}
        run: |
          python -m fno data-snapshot fii-dii-cash-by-session --help
          python -m fno data-snapshot fpi-daily-by-session --help
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-flows-download"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: NSE FII/DII cash values and NSDL's daily FPI report
        if: ${{ !inputs.dry_run }}
        run: |
          python -m fno data-snapshot fii-dii-cash-by-session
          python -m fno data-snapshot fpi-daily-by-session
      - name: Alert #fno-desk when the job failed
        if: ${{ failure() && !inputs.dry_run }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python -c "import sys; from fno.ingestion.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O flows download: the GitHub Actions run failed; see $RUN_URL"
