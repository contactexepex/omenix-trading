# Story NP2c: Google News links resolved to the publisher's own URL, one write-once resolution file each
# (docs/stories/NP2c-resolve-pass.md). Manual only (workflow_dispatch): NO schedule until the owner enables one at go-live,
# so merging this file requests nothing. Without `apply` it is the PROBE: it asks the resolver (real, paced, capped
# requests) and writes nothing. Same concurrency group as news-promote and news-cluster, so runs are serial. Hash ids
# and counts only; no title, link or host is committed or printed. Research data only; never places orders.
name: news-resolve

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the resolution files (default: probe, write nothing)."
        type: boolean
        default: false
      limit:
        description: "Links to resolve this run (at most 80)."
        type: string
        default: "80"
      dry_run:
        description: "Validate runner + deps + CLI load; no request, no Drive, no commit, no Slack."
        type: boolean
        default: false

permissions:
  contents: write # commits the resolved-files manifest and the receipts of the files written

concurrency:
  group: news-record
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      MANIFEST: research/data/manifests/news/resolved.csv
      RECEIPTS: receipts/raw/news/resolved receipts/_batches
      COMMIT_MESSAGE: "NP2c Actions: news resolutions"
      APPLY: ${{ inputs.apply && '--apply' || '' }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: DRY-RUN validation (no request, no Drive, no commit, no Slack; prove the CLI loads)
        if: ${{ inputs.dry_run }}
        run: python -m fno news resolve --help
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-news-resolve"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve the recent Google News links
        id: resolve
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          set -o pipefail
          python -m fno news resolve $APPLY --limit "$LIMIT" | tee resolve.log
      - name: Commit the resolved-files manifest and receipts (the manifest only when it is whole)
        if: ${{ !inputs.dry_run && inputs.apply }}
        run: bash ops/commit_news_record.sh
      - name: Fail the run when the pass was not clean (the alert was sent by the command)
        if: ${{ steps.resolve.outcome != 'success' && !inputs.dry_run }}
        run: exit 1
      - name: Alert the desk channel when the job failed (a killed run cannot alert by itself)
        if: ${{ failure() && !inputs.dry_run }} # O10's watcher sees an alert step on every failure
        run: |
          python -c "import sys; from fno.ingestion.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O news resolve: the job failed (resolve ${{ steps.resolve.outcome }}); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
