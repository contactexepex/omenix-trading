# Story P2a: news feeds into Staging (docs/stories/P2-news-dedup.md). Manual only (workflow_dispatch): NO schedule until the
# owner enables one at go-live, so merging this file starts no fetch and no Staging write. The feed list is a private
# Drive file (never in this repository); the Record is the promotion gate's alone. Public feeds, no key, no cookie.
# Research data only; never places orders.
name: news-fetch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate runner + deps + CLI load; write nothing to Drive, no commit, no Slack."
        type: boolean
        default: false

permissions:
  contents: write # commits the poll log (feed id, path, SHA-256, size: no URL, no title)

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      POLLS: research/data/manifests/news
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: DRY-RUN validation (no Drive, no commit, no Slack; prove the CLI loads)
        if: ${{ inputs.dry_run }}
        run: python -m fno news fetch --help
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-news-fetch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch each private feed once into Staging
        id: fetch
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          set -o pipefail
          python -m fno news fetch | tee fetch.log
      - name: Commit the poll log
        if: ${{ !inputs.dry_run }}
        run: |
          git add "$POLLS"
          git diff --cached --quiet || git commit -m "P2a Actions: news polls $(date -u +%FT%TZ)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: Fail the run when the fetch was not clean (the alert was sent by the command)
        if: ${{ steps.fetch.outcome != 'success' && !inputs.dry_run }}
        run: exit 1
      - name: Alert the desk channel when the job failed (a job that dies before the command runs cannot alert itself)
        if: ${{ failure() && !inputs.dry_run }} # O10's watcher sees an alert step on every failure
        run: |
          python -c "import sys; from fno.ingestion.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O news fetch: the job failed (fetch ${{ steps.fetch.outcome }}); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit the pause log (story R1b2; the last step, never fails the run)
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true
        run: bash ops/commit_pause_log.sh
