# Story O6, owner's choice (a) of 13 Oct 2026: the 3 pm quote recorder on NSE's public option chain as a plain
# scheduled job (no AI session, no broker key in GitHub, ever). Runs beside the Claude routine that records Groww's
# quotes; NSE's snapshots go to their own dataset (research/data/quotes/nse/derivatives/quote-snapshots/), never
# mixed with Groww's. Nothing switches until the owner has seen `python -m fno quotes compare` for 3 sessions or more.
# GitHub's schedule can start late, so it starts at about 14:20 IST and waits; the recorder captures from 14:55 and
# retries until 15:10. NSE's session calendar decides the day. Research data only; never places orders.
name: quote-recorder-nse

on:
  schedule:
    - cron: "50 8 * * *" # 14:20 IST every day: the calendar decides (a closed day records nothing)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate runner + deps + CLI load; write nothing to Drive, no commit, no Slack."
        type: boolean
        default: false

permissions:
  contents: write # commits the day's snapshot

concurrency:
  group: quote-recorder-nse
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      SNAPSHOTS: research/data/quotes/nse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt # never requirements-groww.txt: no broker SDK or key here
      - name: DRY-RUN validation (no Drive, no commit, no Slack; prove the CLI loads)
        if: ${{ inputs.dry_run }}
        run: python -m fno quotes record --help
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-quote-recorder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Wait until 14:40 IST (the recorder itself waits at most 20 minutes)
        if: ${{ !inputs.dry_run }}
        run: |
          now=$(TZ=Asia/Kolkata date +%s); start=$(TZ=Asia/Kolkata date -d 'today 14:40' +%s)
          if (( now < start )); then sleep $(( start - now )); fi
      - name: Record NSE's 3 pm quotes (A4 rules, own dataset)
        id: record
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          set -o pipefail
          python -m fno quotes record --source nse | tee record.log
      - name: Commit the snapshot
        if: ${{ !inputs.dry_run }}
        run: |
          git add "$SNAPSHOTS"
          git diff --cached --quiet || git commit -m "O6 Actions: NSE 3 pm quotes $(TZ=Asia/Kolkata date +%F)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: One line to #fno-desk when the result is not good
        if: ${{ steps.record.outcome != 'success' && !inputs.dry_run }}
        run: |
          python -c "import sys; from fno.ingestion.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O 3 pm recorder (NSE, GitHub Actions): ' + sys.argv[1]))" \
            "$(grep -vE '^alert ' record.log | tail -n 1)"
          exit 1
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() && !inputs.dry_run && steps.record.outcome == 'success' }}
        run: >
          python -c "from fno.ingestion.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O 3 pm recorder (NSE, GitHub Actions) failed; see
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
