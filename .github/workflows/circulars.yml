# Story A20b: NSE's and SEBI's circulars kept point in time. Each run lists the circulars not seen before (NSE: its
# circulars API for the last 14 days; SEBI: its latest circulars page) with the time first seen, saves the file of
# each F&O-relevant one, and writes the run's new rows as one part of `circulars/list`, all write-once in the owner's
# Drive (O9); the repository gets only their SHA-256 receipts (committed). Research data only; it never trades.
# Secrets: the Drive and Slack ones the other jobs use; none is printed.
name: circulars

# Re-enabled on 27 Oct 2026 (owner: rebuild the receipts from Drive). It was paused 27 Oct while the receipts of
# `data/circulars/list` were missing (every run stopped at once with "no receipts under it"); they were rebuilt from Drive
# (rebuild-receipts, 131 files) and one manual run went green and captured.
on:
  schedule:
    - cron: "30 2-16 * * *" # hourly, 08:00-22:00 IST, every day: NSE issued circulars on 13 non-session days of 2026
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate runner + deps + CLI load; write nothing to Drive, no commit, no Slack."
        type: boolean
        default: false

permissions:
  contents: write # commits the receipts (receipts/)

concurrency:
  group: circulars
  cancel-in-progress: false

jobs:
  circulars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: DRY-RUN validation (no Drive, no commit, no Slack; prove the CLI loads)
        if: ${{ inputs.dry_run }}
        run: python -m fno circulars --help
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-circulars"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: NSE and SEBI circulars (the job alerts the desk channel itself, naming every problem)
        id: circulars
        if: ${{ !inputs.dry_run }}
        run: python -m fno circulars
      - name: Alert the desk channel when the run failed without the job's own line (a crash, a sender that could not post)
        if: ${{ failure() && !inputs.dry_run }} # always runs on a failure, so O10's watcher sees an alert step; quiet if the job spoke
        env:
          POSTED: ${{ steps.circulars.outputs.posted }}
        run: |
          if [ "$POSTED" = "true" ]; then echo "the job already spoke (its alert, or an episode already alerted)"; exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python -c "import sys; from fno.ingestion.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O circulars: the GitHub Actions run failed without its own alert; see $RUN_URL"
      - name: Commit the pause log (story R1b2; the last step, never fails the run)
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true
        run: bash ops/commit_pause_log.sh
