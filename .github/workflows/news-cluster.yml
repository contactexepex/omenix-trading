# Story P2d: recent articles in the Record clustered into one write-once cluster file per window end
# (docs/stories/P2d-cluster-record.md). Manual only (workflow_dispatch): NO schedule until the owner enables one at go-live, so
# merging this file writes nothing to the Record. Cluster only a window whose end has passed, after the promote that covers it
# (same concurrency group as news-promote, so runs are serial). Hash ids and counts only; nothing of any story is committed.
# Research data only; never places orders.
name: news-cluster

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Window end, ISO with a zone (default: now, floored to the hour). Use a past hour to re-run it: a closed window is a no-op."
        type: string
        required: false
      algorithm:
        description: "Clustering algorithm version: 1 (default) or 2 (NP6a: company list + resolutions, files under news/clusters/2; compare with 1 before cutover)."
        type: choice
        options: ["1", "2"]
        default: "1"
      dry_run:
        description: "Validate runner + deps + CLI load; write nothing to Drive, no commit, no Slack."
        type: boolean
        default: false

permissions:
  contents: write # commits the cluster manifest and the receipts of the files written

concurrency:
  group: news-record
  cancel-in-progress: false

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      MANIFEST: research/data/manifests/news/clusters.csv
      RECEIPTS: receipts/raw/news/clusters receipts/_batches
      COMMIT_MESSAGE: "P2d Actions: news clusters"
      AS_OF: ${{ inputs.as_of }}
      ALGORITHM: ${{ inputs.algorithm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: DRY-RUN validation (no Drive, no commit, no Slack; prove the CLI loads)
        if: ${{ inputs.dry_run }}
        run: python -m fno news cluster --help
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-news-cluster"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Cluster the recent articles into one cluster file
        id: cluster
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          set -o pipefail
          python -m fno news cluster ${AS_OF:+--as-of "$AS_OF"} --algorithm "${ALGORITHM:-1}" | tee cluster.log
      - name: Commit the cluster manifest and receipts (the manifest only when it is whole)
        if: ${{ !inputs.dry_run }}
        run: bash ops/commit_news_record.sh
      - name: Fail the run when the clustering was not clean (the alert was sent by the command)
        if: ${{ steps.cluster.outcome != 'success' && !inputs.dry_run }}
        run: exit 1
      - name: Alert the desk channel when the job failed (a killed run cannot alert by itself)
        if: ${{ failure() && !inputs.dry_run }} # O10's watcher sees an alert step on every failure
        run: |
          python -c "import sys; from fno.ingestion.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O news cluster: the job failed (cluster ${{ steps.cluster.outcome }}); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
