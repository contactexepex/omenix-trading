# Story A12: the company filings archive, run as a plain scheduled job (no AI session). Research data only: it reads
# NSE's public filing lists and XBRL files (about one request per second per host) and saves them to the owner's
# Google Drive; it never trades. It follows the owner's work queue in the progress file in Drive (step 1: the Nifty
# 500's last 3 years; step 2: older years), each run continuing where the last stopped; after that, a daily check.
# Secrets: the owner adds them once (docs/stories/A12-owner-checklist.md); none is printed or written to a file.
name: filings-archive

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours; after the backfill, three of the four runs find the daily check done
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate runner + deps + CLI load; write nothing to Drive, no commit, no Slack."
        type: boolean
        default: false
      probe_only:
        description: "Only check that NSE's filing lists answer from GitHub's runners (no Drive)"
        type: boolean
        default: false
      symbols:
        description: "Only these symbols (comma-separated), e.g. a trial; empty: the work queue"
        type: string
        default: ""

permissions:
  contents: write # commits the manifest rows, gaps and run log (research/data/manifests/)

concurrency:
  group: filings-archive # one writer at a time: the manifests are append-only files
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: Probe NSE from this runner (also the DRY-RUN validation; NSE reachability only, no Drive/commit/Slack)
        run: python -m fno filings probe
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.probe_only && !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-filings-archive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Results and shareholding XBRL (backfill, then daily)
        if: ${{ !inputs.probe_only && !inputs.dry_run }}
        env:
          SYMBOLS: ${{ inputs.symbols }} # passed through the environment, never pasted into the shell line
        run: python -m fno filings archive ${SYMBOLS:+--symbols "$SYMBOLS"}
      - name: Announcement and board-meeting day lists
        if: ${{ !inputs.probe_only && !inputs.symbols && !inputs.dry_run }}
        run: python -m fno filings day-lists
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() && !inputs.probe_only && !inputs.dry_run }}
        run: >
          python -c "from fno.ingestion.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O filings archive: the GitHub Actions run failed; see
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
