# Story O6 for G3: NSE's daily index-close file (ind_close_all) as a plain scheduled job (no AI session). Research
# data only; never trades. After NSE's evening file:
#   1. the A9 librarian archives each session's file in Drive with its manifest row (the last week, gaps refilled);
#   2. the A11 sweep keeps any later NSE version beside the original (revisions area, never replacing it);
#   3. `pipeline index-closes` appends the NIFTY 50 and India VIX closes to research/data/nifty-panel/warmup_closes.csv
#      from the version first archived (point in time), never rewriting a row, and the panel reader serves them as
#      closes-only sessions after the panel's last day.
# G1 v2's live forecast needs the previous session's closes before 14:00 IST (judge 47 addendum 4): NSE publishes in
# the evening, so the 21:11 run normally adds them; the 07:41 and 11:41 runs retry, and a close still missing posts one
# #fno-desk line before 14:00. A run before 19:00 IST stops at yesterday (today's file is not out yet), so a morning
# run never alerts about today. One #fno-desk line when a step fails. Secrets: the A12 Drive and Slack ones; none is printed or written to a file.
name: index-closes

on:
  schedule:
    - cron: "41 15 * * *" # 21:11 IST every day: the calendar decides (a closed day adds nothing)
    - cron: "11 2 * * *" # 07:41 IST: retry for the previous session if the evening run missed it
    - cron: "11 6 * * *" # 11:41 IST: last retry, still before 14:00 (GitHub's schedule can start late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate runner + deps + CLI load; write nothing to Drive, no commit, no Slack."
        type: boolean
        default: false

permissions:
  contents: write # commits the closes and the manifest rows

concurrency:
  group: index-closes
  cancel-in-progress: false

jobs:
  closes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      CLOSES: research/data/nifty-panel/warmup_closes.csv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: DRY-RUN validation (no Drive, no commit, no Slack; prove the CLI loads for each command)
        if: ${{ inputs.dry_run }}
        run: |
          python -m fno data-librarian index-close --help
          python -m fno data-revisions sweep --help
          python -m fno pipeline index-closes --help
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-index-closes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: The last session whose file is due (today from 19:00 IST, else yesterday)
        if: ${{ !inputs.dry_run }}
        run: |
          if (( 10#$(TZ=Asia/Kolkata date +%H) >= 19 )); then due=$(TZ=Asia/Kolkata date +%F)
          else due=$(TZ=Asia/Kolkata date -d yesterday +%F); fi
          echo "DUE=$due" >> "$GITHUB_ENV"; echo "closes due through $due"
      - name: Archive the last week's index-close files in Drive (A9)
        id: librarian
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          python -m fno data-librarian index-close \
            --from "$(TZ=Asia/Kolkata date -d '-7 days' +%F)" --to "$DUE"
      - name: Keep later NSE versions beside the originals (A11)
        id: revisions
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          python -m fno data-revisions sweep index-close \
            --from "$(TZ=Asia/Kolkata date -d '-7 days' +%F)" --to "$DUE"
      - name: Append the new sessions' closes (point in time, never rewriting)
        id: append
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: python -m fno pipeline index-closes --to "$DUE"
      - name: Commit the closes
        if: ${{ !inputs.dry_run }}
        run: |
          git add "$CLOSES"
          git diff --cached --quiet || git commit -m "O6 Actions: NIFTY 50 and India VIX closes $(TZ=Asia/Kolkata date +%F)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: One line to #fno-desk when the librarian failed (the append step alerts by itself)
        if: ${{ steps.librarian.outcome != 'success' && !inputs.dry_run }}
        run: |
          python -c "import sys; from fno.ingestion.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O daily index closes: the archive step failed (Drive, NSE or the calendar: its log names it); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
      - name: Fail the run when the append stopped (a named stop posted its own line; otherwise the next step speaks)
        if: ${{ steps.append.outcome != 'success' && !inputs.dry_run }}
        run: exit 1
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() && !inputs.dry_run && steps.librarian.outcome == 'success' && steps.append.outputs.posted != 'true' }} # one line per run (O8c)
        run: >
          python -c "from fno.ingestion.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O daily index closes (GitHub Actions) failed; see
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
      - name: Commit the pause log (story R1b2; the last step, never fails the run)
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true
        run: bash ops/commit_pause_log.sh
