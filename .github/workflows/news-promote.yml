# Story P2b2: staged news polls through the article gate into the write-once Record (docs/stories/P2b-article-gate.md).
# Manual only (workflow_dispatch): NO schedule until the owner enables one at go-live, so merging this file writes
# nothing to the Record. Articles, titles and URLs live only in private Drive; this repository gets the news manifest
# (hash ids) and one SHA-256 receipt per Drive file. Research data only; never places orders.
name: news-promote

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "First day to promote, YYYY-MM-DD (required: never all history)."
        type: string
        required: true
      dry_run:
        description: "Validate runner + deps + CLI load; write nothing to Drive, no commit, no Slack."
        type: boolean
        default: false

permissions:
  contents: write # commits the news manifest and the receipts of the files the gate wrote

concurrency:
  group: news-record
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      MANIFEST: research/data/manifests/news/articles.csv
      EXTRA_MANIFESTS: research/data/manifests/news/wrappers.csv # the index of Google News articles (NP2d)
      RECEIPTS: receipts/raw/news receipts/_batches
      COMMIT_MESSAGE: "P2b2 Actions: news record"
      FROM_DATE: ${{ inputs.from_date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: DRY-RUN validation (no Drive, no commit, no Slack; prove the CLI loads)
        if: ${{ inputs.dry_run }}
        run: python -m fno news promote --help
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-news-promote"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Promote staged polls through the article gate
        id: promote
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          set -o pipefail
          python -m fno news promote --from "$FROM_DATE" | tee promote.log
      - name: Commit the news manifest and receipts (the manifest only when it is whole)
        if: ${{ !inputs.dry_run }}
        run: bash ops/commit_news_record.sh
      - name: Fail the run when the promotion was not clean (the alert was sent by the command)
        if: ${{ steps.promote.outcome != 'success' && !inputs.dry_run }}
        run: exit 1
      - name: Alert the desk channel when the job failed (a killed promote cannot alert by itself)
        if: ${{ failure() && !inputs.dry_run }} # O10's watcher sees an alert step on every failure
        run: |
          python -c "import sys; from fno.ingestion.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O news promote: the job failed (promote ${{ steps.promote.outcome }}); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
