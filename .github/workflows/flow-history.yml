# Story A23: the FII/DII flow history, kept daily. NSE's participant-wise trading volume and FII derivatives statistics
# are archived to the owner's Drive by the A9 librarian (each with its SHA-256 manifest row, committed), later NSE
# versions are kept beside the originals (A11), and `flows table` enters each new session in the flow-history table
# with NSE's write time (A8's sweep, its log committed) and the session it was public from. NSE writes both files
# about 19:14 IST; the 21:30 run takes them, the 07:15 run retries (GitHub starts crons hours late; a file already
# archived is not fetched again). Research data only; it never trades. Secrets: the Drive and Slack ones; none printed.
name: flow-history

on:
  schedule:
    - cron: "0 16 * * *" # 21:30 IST every day: the calendar decides (a closed day has no file)
    - cron: "45 1 * * *" # 07:15 IST: retry for the previous session if the evening run missed it
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate runner + deps + CLI load; write nothing to Drive, no commit, no Slack."
        type: boolean
        default: false

permissions:
  contents: write # commits the manifest rows, the write-time logs and the table's receipts

concurrency:
  group: flow-history
  cancel-in-progress: false

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: DRY-RUN validation (no Drive, no commit, no Slack; prove the CLI loads for each command)
        if: ${{ inputs.dry_run }}
        run: |
          python -m fno data-librarian participant-volume --help
          python -m fno data-librarian fii-stats --help
          python -m fno data-revisions sweep --help
          python -m fno flows table --help
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-flow-history"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: The last session whose files are due (today from 19:30 IST, else yesterday)
        if: ${{ !inputs.dry_run }}
        run: |
          if (( 10#$(TZ=Asia/Kolkata date +%H%M) >= 1930 )); then due=$(TZ=Asia/Kolkata date +%F)
          else due=$(TZ=Asia/Kolkata date -d yesterday +%F); fi
          echo "DUE=$due" >> "$GITHUB_ENV"; echo "flow files due through $due"
          echo "FROM=$(TZ=Asia/Kolkata date -d '-7 days' +%F)" >> "$GITHUB_ENV"
      - name: Archive the last week's participant-volume files in Drive (A9)
        id: volume
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: python -m fno data-librarian participant-volume --from "$FROM" --to "$DUE"
      - name: Archive the last week's FII derivatives statistics in Drive (A9)
        id: fii
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: python -m fno data-librarian fii-stats --from "$FROM" --to "$DUE"
      - name: Keep later NSE versions beside the originals (A11)
        id: revisions
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          python -m fno data-revisions sweep participant-volume --from "$FROM" --to "$DUE"
          python -m fno data-revisions sweep fii-stats --from "$FROM" --to "$DUE"
      - name: Enter the new participant-volume sessions in the flow table (alerts by itself)
        id: volume_table
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: python -m fno flows table participant-volume
      - name: Enter the new FII statistics sessions in the flow table (alerts by itself)
        id: fii_table
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: python -m fno flows table fii-stats
      - name: Fail the run when a step failed (O10's watcher records it)
        if: ${{ !inputs.dry_run }}
        env:
          OUTCOMES: >-
            ${{ steps.volume.outcome }} ${{ steps.fii.outcome }} ${{ steps.revisions.outcome }}
            ${{ steps.volume_table.outcome }} ${{ steps.fii_table.outcome }}
        run: |
          for outcome in $OUTCOMES; do [ "$outcome" = "success" ] || exit 1; done
      - name: Alert the desk channel, naming each failed step that did not post its own line
        if: ${{ failure() && !inputs.dry_run }} # always runs on a failure, so O10's watcher sees an alert step; quiet if all spoke
        env:
          VOLUME: ${{ steps.volume.outcome }}
          FII: ${{ steps.fii.outcome }}
          REVISIONS: ${{ steps.revisions.outcome }}
          VOLUME_TABLE: ${{ steps.volume_table.outcome == 'success' || steps.volume_table.outputs.posted == 'true' }}
          FII_TABLE: ${{ steps.fii_table.outcome == 'success' || steps.fii_table.outputs.posted == 'true' }}
        run: |
          failed=""
          [ "$VOLUME" = "success" ] || failed="$failed participant-volume archive (a session not published, NSE or Drive);"
          [ "$FII" = "success" ] || failed="$failed FII statistics archive (a session not published, NSE or Drive);"
          [ "$REVISIONS" = "success" ] || failed="$failed revision sweep;"
          [ "$VOLUME_TABLE" = "true" ] || failed="$failed participant-volume table (no line of its own);"
          [ "$FII_TABLE" = "true" ] || failed="$failed FII statistics table (no line of its own);"
          if [ -z "$failed" ]; then echo "every failed step already spoke (its alert)"; exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python -c "import sys; from fno.ingestion.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O flow history:$failed see $RUN_URL"
