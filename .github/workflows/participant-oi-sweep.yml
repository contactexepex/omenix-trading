# Story O6: the A8 monthly sweep for NSE rewrites of participant-OI files as a plain scheduled job (no AI session),
# side by side with the Claude routine "participant-OI rewrite sweep (monthly)" (07:07 IST on the 1st) until the owner
# switches. Research data only; never trades. Same command (`participant-oi sweep`); its sweep log goes to
# research/data/participant_oi/actions/. A new version found is saved in Drive's revisions area with its index row
# (A11, idempotent: the routine's later run finds the same version and changes nothing), and the pipeline fires the
# dry-run routine once for it (a republished file). Runs at 05:37 IST, before the routine, so both see NSE as it is.
# Secrets: docs/stories/O6-owner-checklist.md; none is printed or written to a file.
name: participant-oi-sweep

on:
  # schedule:  # DISABLED for migration; re-enable at cutover
    # - cron: "7 0 1 * *" # 05:37 IST on the 1st of each month  # DISABLED for migration; re-enable at cutover
  workflow_dispatch:

permissions:
  contents: write # commits the sweep log and the revision index rows

concurrency:
  group: participant-oi-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      FNO_ROUTINE_DRY_RUN_TRIGGER_ID: ${{ secrets.FNO_ROUTINE_DRY_RUN_TRIGGER_ID }}
      FNO_ROUTINE_DRY_RUN_TOKEN: ${{ secrets.FNO_ROUTINE_DRY_RUN_TOKEN }}
      EVIDENCE: research/data/participant_oi/actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-participant-oi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Sweep every recorded file (A8; new versions kept, A11)
        id: sweep
        continue-on-error: true
        run: |
          set -o pipefail
          python -m fno participant-oi sweep --evidence-folder "$EVIDENCE" | tee sweep.log
      - name: Commit the sweep log
        run: |
          git add "$EVIDENCE"
          git diff --cached --quiet || git commit -m "O6 Actions: participant-OI sweep $(TZ=Asia/Kolkata date +%F)"
          git pull --no-rebase --no-edit origin main && git push origin HEAD:main
      - name: Fire the dry-run routine for republished files, run summary in Drive, one line to #fno-desk (O6)
        if: false # DISABLED for migration: re-enable once Claude routines are repointed to exepex/omenix-trading
        run: |
          notes=()
          while IFS= read -r line; do notes+=(--note "$line"); done < <(grep -E '^(MOVED|no answer|sweep:)' sweep.log)
          python -m fno pipeline fire participant-oi-sweep --days 2 \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --download "${{ steps.sweep.outcome == 'success' && 'success' || 'exit 1 (moved, unanswered or new versions: see the notes)' }}" \
            "${notes[@]}"
      - name: Alert #fno-desk when the job itself failed
        if: ${{ failure() }}
        run: >
          python -c "from fno.composition import build_alert_sender;
          print(build_alert_sender().send('Omenix F&O participant-OI sweep (GitHub Actions) failed; see
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'))"
