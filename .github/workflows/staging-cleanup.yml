# Story S1: move staged copies older than 7 days to Drive's trash, but ONLY copies proven promoted (docs/stories/S1-staging-cleanup.md).
# Manual only (workflow_dispatch): NO schedule until the owner enables one at go-live. Report only unless `apply` is ticked, so a
# first dispatch deletes nothing. Drive's trash keeps a moved file for about 30 days. A staged news poll is removed only when every
# article in it is already in the Record: the Record keeps an article's fields, not the raw poll, so this permanently loses (after
# the trash) the item body, author, categories, media and a wrapper item's real link (owner's choice (b), 27 Oct 2026). Each job
# runs in the concurrency group of the workflow that writes what it cleans (pipeline-staging, news-record), so it never overlaps a
# stage or a promote. Research data only; never places orders; no Groww; commits nothing.
name: staging-cleanup

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Really move the proven-promoted copies older than 7 days to Drive's trash (off: report only)."
        type: boolean
        default: false
      limit:
        description: "Most staged copies examined in one run."
        type: string
        default: "500"
      dry_run:
        description: "Validate runner + deps + CLI load; touch nothing in Drive, no Slack."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nse-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pipeline-staging
      cancel-in-progress: false
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      APPLY: ${{ inputs.apply }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: DRY-RUN validation (no Drive, no Slack; prove the CLI loads)
        if: ${{ inputs.dry_run }}
        run: python -m fno staging cleanup --help
      - name: Clean the NSE staging copies (report only unless apply is ticked)
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "$APPLY" = "true" ]; then flag="--apply"; else flag=""; fi
          python -m fno staging cleanup --source nse --limit "$LIMIT" $flag

  news-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: news-record
      cancel-in-progress: false
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      APPLY: ${{ inputs.apply }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: DRY-RUN validation (no Drive, no Slack; prove the CLI loads)
        if: ${{ inputs.dry_run }}
        run: python -m fno staging cleanup --help
      - name: Clean the news staging polls (report only unless apply is ticked)
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "$APPLY" = "true" ]; then flag="--apply"; else flag=""; fi
          python -m fno staging cleanup --source news --limit "$LIMIT" $flag
