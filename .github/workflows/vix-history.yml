# Story A15 on a schedule (audit Part A2, owner 16 Oct 2026: external data up to date every day): NSE's India VIX
# month files as a plain job (no AI session). Research data only; never trades. A15 is built on whole months: a month
# still running is never fetched (its file would grow after it was archived), so the daily VIX close stays with
# index-closes.yml and this job adds each month's OHLC rows once the month has ended. It runs every day for the
# previous IST month, so a month is archived on the 1st and a day NSE is late is retried the next morning:
#   1. `vix-history fill` archives the month in Drive with its manifest row if it is missing (a month already archived
#      is read back and checked, never replaced) and appends its days to the table in Drive (one write-once part with
#      its receipt, story O9b), then writes the checks as a new Drive snapshot;
#   2. `vix-history sweep` keeps any later NSE version of the month beside the original (A11).
# One #fno-desk line when a step fails; O10's capture-watch records the failed run. Secrets: the A12 Drive and Slack
# ones; none is printed or written to a file.
name: vix-history

on:
  # schedule:  # DISABLED for migration; re-enable at cutover
    # - cron: "41 1 * * *" # 07:11 IST every day: the previous month (nothing new until a month has ended)  # DISABLED for migration; re-enable at cutover
  workflow_dispatch:

permissions:
  contents: write # commits the receipts of the VIX table's parts and checks (O9b) and the manifest rows

concurrency:
  group: vix-history
  cancel-in-progress: false

jobs:
  vix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      RECEIPTS: receipts/data/vix
      MANIFESTS: research/data/manifests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-vix-history"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: The previous IST month
        run: echo "MONTH=$(TZ=Asia/Kolkata date -d "$(TZ=Asia/Kolkata date +%Y-%m-01) -1 day" +%Y-%m)" >> "$GITHUB_ENV"
      - name: Archive the month and append its days (A15)
        id: fill
        continue-on-error: true
        run: python -m fno vix-history fill --from "$MONTH" --to "$MONTH"
      - name: Keep a later NSE version of the month beside the original (A11)
        id: sweep
        continue-on-error: true
        run: python -m fno vix-history sweep --from "$MONTH" --to "$MONTH"
      - name: Commit the receipts of the table and its checks (the data is in Drive, O9b) and the manifest rows
        id: commit
        run: |
          git add "$MANIFESTS"
          if [ -d "$RECEIPTS" ]; then git add "$RECEIPTS"; fi
          git diff --cached --quiet || git commit -m "A15 Actions: India VIX month $MONTH"
          for try in 1 2 3; do  # another job may push between the pull and the push
            git pull --no-rebase --no-edit origin main && git push origin HEAD:main && exit 0
            sleep $((try * 10))
          done
          exit 1
      # One alert step for every failure (judge 351 SF1): `!cancelled()` keeps it running after a failed commit, which a
      # plain `if:` (an implicit `success() &&`) would skip; a cancelled or timed-out run is O10's capture-watch's to post
      - name: "One line to #fno-desk when the run failed: each step's outcome"
        if: ${{ !cancelled() && (steps.fill.outcome != 'success' || steps.sweep.outcome != 'success' || failure()) }}
        run: |
          python -c "import sys; from fno.ingestion.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O India VIX month ${MONTH:-unknown}: fill ${{ steps.fill.outcome }}, sweep ${{ steps.sweep.outcome }}, commit ${{ steps.commit.outcome }} (NSE, Drive, the checks or the push: the log names it); see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
