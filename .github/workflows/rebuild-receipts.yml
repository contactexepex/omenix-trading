# Story RR1: write the SHA-256 receipts of Drive files whose receipts are not in this repository (docs/stories/RR1-rebuild-receipts.md).
# Manual only (workflow_dispatch): NO schedule. Report only unless `apply` is ticked, so a first dispatch writes nothing. It reads
# Drive and writes only `receipts/` (committed to main); it changes nothing in Drive. A rebuilt receipt proves the file's bytes AS OF
# THE REBUILD, not what the original run wrote (the owner's accepted caveat). It never replaces an existing receipt.
# Research data only; never places orders; no Groww.
name: rebuild-receipts

on:
  workflow_dispatch:
    inputs:
      prefixes:
        description: "Drive path prefixes, space separated, area included."
        type: string
        default: "data/circulars/list data/flows/history"
      apply:
        description: "Write and commit the missing receipts (off: report only)."
        type: boolean
        default: false
      dry_run:
        description: "Validate runner + deps + CLI load; touch nothing in Drive, no commit."
        type: boolean
        default: false

permissions:
  contents: write # commits the rebuilt receipts

concurrency:
  group: rebuild-receipts
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      PREFIXES: ${{ inputs.prefixes }}
      APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"
      - name: DRY-RUN validation (no Drive, no commit; prove the CLI loads)
        if: ${{ inputs.dry_run }}
        run: python -m fno data-repair rebuild-receipts --help
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-rebuild-receipts"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Rebuild the missing receipts (report only unless apply is ticked)
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "$APPLY" = "true" ]; then flag="--apply"; else flag=""; fi
          python -m fno data-repair rebuild-receipts $PREFIXES $flag
