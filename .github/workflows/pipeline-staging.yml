# Phase 1 of docs/PIPELINE_DESIGN.md: one dataset through Staging and the promotion gate. By hand only (no schedule):
# the live collection workflows are untouched and keep writing the Record directly until the owner switches them.
#   1. `stage` fetches NSE's files for the range into the Drive `staging` area (it can write nothing else);
#   2. `promote` runs the staged files through the librarian's rules (calendar session, sourced exceptions, content check)
#      and the date-identity check into the write-once Record (Drive `raw` with its manifest row); later versions go to
#      the revisions area; it commits the manifest rows and posts any day left without a record to #fno-desk.
#      No numeric freshness window runs unless config.yaml sets promotion.max_lag_days (owner decision, unset).
# Promote is off by default: a first dispatch only stages (the Drive staging area, never the Record).
# Research data only; never trades; no Groww. Secrets: the Drive and Slack ones; none is printed or written to a file.
name: pipeline-staging

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset (as in `python -m fno stage --help`)"
        type: choice
        options: [participant-oi, participant-volume, fii-stats, fo-bhavcopy, cm-bhavcopy]
        default: participant-oi
      days:
        description: "Days back from today (IST), up to yesterday, to stage (and to promote, when the promote input is on)"
        type: string
        default: "7"
      promote:
        description: "Also promote the staged files into the write-once Record (off: stage only, which writes the Drive staging area and nothing else)."
        type: boolean
        default: false
      dry_run:
        description: "Prove the CLI loads; write nothing to Drive, no commit, no Slack."
        type: boolean
        default: false

permissions:
  contents: write # commits the manifest rows

concurrency:
  group: pipeline-staging
  cancel-in-progress: false

jobs:
  stage-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
      DATASET: ${{ inputs.dataset }}
      DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: DRY-RUN validation (no Drive, no commit, no Slack)
        if: ${{ inputs.dry_run }}
        run: |
          python -m fno stage --help
          python -m fno promote --help
      - name: Commit identity and the public-record scan (story O5)
        if: ${{ !inputs.dry_run }}
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-pipeline-staging"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Stage the range (Staging only)
        id: stage
        if: ${{ !inputs.dry_run }}
        continue-on-error: true # one unpublished day must not stop the promote step; the last step fails the run
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days must be a number"; exit 1; }
          python -m fno stage "$DATASET" --from "$(TZ=Asia/Kolkata date -d "-$DAYS days" +%F)"
      - name: Promote what passes the checks into the Record
        if: ${{ !inputs.dry_run && inputs.promote }}
        run: |
          python -m fno promote "$DATASET" --from "$(TZ=Asia/Kolkata date -d "-$DAYS days" +%F)"
      - name: Fail the run when staging stopped (when promote is on, the promote step has run either way)
        if: ${{ steps.stage.outcome != 'success' && !inputs.dry_run }}
        run: exit 1
