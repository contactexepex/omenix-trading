# Story A20a: NSE's daily F&O master files kept point in time. NSE replaces the ban list (fo_secban.csv) and the market
# lots (fo_mktlots.csv) in place, so they are archived to the owner's Drive: the ban list under the trade date it names
# (from the evening before; a stale one is refused), the lots once per trading day, each with its SHA-256 manifest row
# (committed). Research data only; it never trades. Secrets: the Drive and Slack ones the other jobs use; none printed.
name: fo-masters

on:
  # schedule:  # DISABLED for migration; re-enable at cutover
    # - cron: "30 0 * * *" # 06:00 IST: lands about 11:00 at GitHub's usual lateness, before A14c's 14:05 lot check  # DISABLED for migration; re-enable at cutover
    # - cron: "15 2 * * *" # 07:45 IST: the ban list for today is written about 18:12 IST the evening before  # DISABLED for migration; re-enable at cutover
    # - cron: "45 5 * * *" # 11:15 IST retry (GitHub starts crons hours late; a second run keeps the first copies)  # DISABLED for migration; re-enable at cutover
    # - cron: "15 13 * * *" # 18:45 IST: the next session's ban list, written about 18:12 IST, filed under its date  # DISABLED for migration; re-enable at cutover
  workflow_dispatch:

permissions:
  contents: write # commits the manifest rows (research/data/manifests/)

concurrency:
  group: fo-masters
  cancel-in-progress: false

jobs:
  masters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FNO_GDRIVE_FOLDER_ID: ${{ secrets.FNO_GDRIVE_FOLDER_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_ID }}
      FNO_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.FNO_GDRIVE_OAUTH_CLIENT_SECRET }}
      FNO_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.FNO_GDRIVE_OAUTH_REFRESH_TOKEN }}
      FNO_SLACK_BOT_TOKEN: ${{ secrets.FNO_SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Commit identity and the public-record scan (story O5)
        run: |
          git config core.hooksPath .githooks
          git config user.name "omenix-fo-masters"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Ban list and market lots (the job alerts #fno-desk itself, naming every failure)
        id: masters
        run: python -m fno fo-masters
      - name: Alert #fno-desk when the run failed without the job's own line (a crash, a sender that could not post)
        if: ${{ failure() }} # always runs on a failure, so O10's watcher sees an alert step; quiet if the job spoke
        env:
          POSTED: ${{ steps.masters.outputs.posted }}
        run: |
          if [ "$POSTED" = "true" ]; then echo "the job already spoke (its alert)"; exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python -c "import sys; from fno.ingestion.composition import build_alert_sender; print(build_alert_sender().send(sys.argv[1]))" \
            "Omenix F&O master files: the GitHub Actions run failed without its own alert; see $RUN_URL"
