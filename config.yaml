# Omenix F&O (data-ingestion backend) settings. Only the keys listed in fno/shared/config.py (ALLOWED_APP_KEYS) are
# allowed; any other key is an error, so a stale or misspelt setting is never silently ignored.

# Market data for the `chain` and `groww-check` commands: "nse" (free, public NSE website),
# "groww" (Groww Trade API, credentials in environment variables only), "sample" (offline synthetic data),
# or "auto" (Groww when its credentials are set, else NSE).
provider: nse

# The 3 pm quote recorder (story A4) has its own source, independent of `provider` above.
quotes:
  provider: auto
  # Story A4e: named capture windows, each in its own dataset (quote-snapshots-<name>); `quotes record --window v4`.
  # The default capture (no --window) is A4's 14:55-15:10 and is not set here.
  windows:
    v4: {start: "14:32", end: "14:40", max_early_wait_minutes: 30}  # after A16's 14:30 mark (Groww cap; 25 Oct)

# Fallback lot sizes (NSE revises these; the NSE provider infers the live value from order quantities).
lot_sizes:
  NIFTY: 65
  BANKNIFTY: 30
  FINNIFTY: 60
  MIDCPNIFTY: 120

# The staging -> promotion gate (docs/PIPELINE_DESIGN.md). `max_lag_days` is the owner's numeric freshness window (open
# decision 1): unset (null) means no window, only the identity check (a file's own date must be its session).
promotion:
  max_lag_days: null

# Resilience layer (story R1): per-source overrides of the retry, breaker and rate settings, e.g.
#   resilience: {nse: {breaker: {cool_down_seconds: 1800}}}
# Empty means the shipped defaults, which are today's numbers (fno/shared/resilience/settings.py).
resilience: {}

# F&O alerts go only to #fno-desk, never to #market-brief.
slack:
  channel_name: fno-desk
  channel_id: C0C89E8QCCD
