# Omenix F&O settings. Only the keys listed in fno/config.py (ALLOWED_APP_KEYS) are allowed; any other
# key is an error. Money rules (account size, per-trade risk, brake) arrive with their stories, never ad hoc.

# Market data for the `chain` and `groww-check` commands: "nse" (free, public NSE website),
# "groww" (Groww Trade API, credentials in environment variables only), "sample" (offline synthetic data),
# or "auto" (Groww when its credentials are set, else NSE).
provider: nse

# The 3 pm quote recorder (story A4) has its own source, independent of `provider` above.
quotes:
  provider: auto
  # Story A4e: named capture windows, each in its own dataset (quote-snapshots-<name>); `quotes record --window v4`.
  # The default capture (no --window) is A4's 14:55-15:10 and is not set here.
  windows:
    v4: {start: "14:32", end: "14:40", max_early_wait_minutes: 30}  # after A16's 14:30 mark (Groww cap; 25 Oct)

underlyings: [NIFTY, BANKNIFTY]

# Fallback lot sizes (NSE revises these; the NSE provider infers the live value from order quantities).
lot_sizes:
  NIFTY: 65
  BANKNIFTY: 30
  FINNIFTY: 60
  MIDCPNIFTY: 120

# Groww F&O charges for options (verify against Groww's current pricing page).
charges:
  brokerage_per_order: 20.0
  stt_sell_pct: 0.15           # on sell-side premium; raised from 0.1% by Budget 2026, from 1 Apr 2026 (applied to all dates: C1 known limits)
  stt_exercise_pct: 0.15       # on the intrinsic value of an exercised option, paid by the purchaser; 0.125% up to 31 Mar 2026 (NSE circular NSE/FATAX/73524, Ref 02/2026, 31 Mar 2026; story E7)
  exchange_txn_pct: 0.03503    # NSE options transaction charge on premium
  sebi_per_crore: 10.0
  ipft_per_crore: 50.0         # NSE investor protection fund, options premium
  stamp_duty_buy_pct: 0.003
  gst_pct: 18.0                # CGST 9% + SGST 9% (or IGST 18%)

# F&O output goes only to #fno-desk, never to #market-brief.
slack:
  channel_name: fno-desk
  channel_id: C0C89E8QCCD

risk_free_rate: 0.065

# Risk manager (stories C2 and C5, fno/risk/): one profile per kind of account, each listing the rules it runs and
# exactly their settings (fno/risk/profile_settings.py). A rule passes at its limit and refuses beyond it, except the
# drawdown brake, which stops entries at its amount. Owner decisions (docs/DESK_DECISIONS.md).
risk:
  profiles:
    # The three paper books, each on its own account: Rs 20 lakh and Rs 10,000 a trade (14 Oct 2026); bucket, open-risk
    # and new-risk caps and the Rs 1.2 lakh brake (15 Oct 2026, design v2 6.2); no flat 3-trade limit and no old stress
    # or exposure limit (15 Oct 2026, "1 A" and "2 A"). Caps are sums of B2 maximum losses, the proposal's included:
    # limits on new entries, never a stop. Margin data older than one session means no new entry (design 6.1a).
    books:
      rules: [paper_account, max_loss_per_trade, bucket_cap, open_risk_cap, new_risk_per_day, drawdown_brake,
              margin_room]
      paper_account_rs: 2000000    # every book and shadow account opens with this; a book opened otherwise trades nothing
      max_loss_per_trade_rs: 10000 # one trade's modelled maximum loss, every charge and pad included
      bucket_cap_rs: 30000         # one bucket: an underlying group and a side of exposure
      open_risk_cap_rs: 150000     # all open positions of the book
      new_risk_per_day_rs: 50000   # the trades opened in one session
      drawdown_brake_rs: 120000    # closed equity this far below its high: no new trades until the owner restarts
      # Side(s) of exposure per structure code; a code not listed is unmapped and refused (design 6.1a). A directional
      # spread lists two sides and counts its full maximum loss in both buckets (owner, 15 Oct 2026, "1 B"): a credit
      # vertical [its direction, short_volatility], a debit vertical [its direction, long_volatility]. LC and LP (a
      # bought option, a directional bet that gains when movement grows): orchestrator decision, owner to confirm
      # (owner away, 15 Oct 2026; response 105 addendum 4).
      bucket_sides:
        SF: short_volatility
        SC: short_volatility
        BF: long_volatility
        PCS: [bullish, short_volatility]   # bull put credit spread
        CCS: [bearish, short_volatility]   # bear call credit spread
        CDS: [bullish, long_volatility]    # bull call debit spread
        PDS: [bearish, long_volatility]    # bear put debit spread
        LC: [bullish, long_volatility]     # long call: orchestrator decision, owner to confirm
        LP: [bearish, long_volatility]     # long put: orchestrator decision, owner to confirm
      margin_max_age_sessions: 1
    # The Manual paper account (owner, 13 Oct 2026; unchanged on 15 Oct 2026): Rs 5 lakh, Rs 10,000 a trade, 3 open
    # trades, Rs 30,000 brake, C2's stress and exposure limits, margins up to 7 days old.
    manual:
      rules: [paper_account, max_loss_per_trade, max_open_trades, drawdown_brake, stress_loss, exposure_limit,
              margin_room]
      paper_account_rs: 500000
      max_loss_per_trade_rs: 10000
      max_open_trades: 3
      drawdown_brake_rs: 30000
      max_stress_loss_rs: 30000    # open trades (from marks) plus the proposal (from entry), worst scenario below
      # Proposed values, reasoning only (design 8.1); to be set from research before paper trading.
      exposure:
        nifty_move_pct: 2
        max_move_loss_rs: 15000
        iv_rise_points: 5
        max_iv_loss_rs: 15000
      margin_max_age_days: 7
  # Stress scenarios (design 8.1) for the profiles that run stress_loss: NIFTY move in %, every leg's implied volatility times iv_factor, days that pass.
  # Replays: the NIFTY 50 and India VIX close-to-close moves of the day (previous session to that day), from
  # research/data/nifty-panel/warmup_closes.csv; tests/risk/test_scenarios_data.py checks them against those closes.
  scenarios:
    - {name: nifty_down_8pct, nifty_move_pct: -8, iv_factor: 1, days: 1}
    - {name: nifty_down_5pct, nifty_move_pct: -5, iv_factor: 1, days: 1}
    - {name: nifty_up_5pct, nifty_move_pct: 5, iv_factor: 1, days: 1}
    - {name: nifty_up_8pct, nifty_move_pct: 8, iv_factor: 1, days: 1}
    - {name: iv_double, nifty_move_pct: 0, iv_factor: 2, days: 1}
    - {name: iv_half, nifty_move_pct: 0, iv_factor: 0.5, days: 1}
    - {name: nifty_down_8pct_iv_double, nifty_move_pct: -8, iv_factor: 2, days: 1}
    - {name: nifty_up_5pct_iv_half, nifty_move_pct: 5, iv_factor: 0.5, days: 1}
    - {name: replay_2020-03-23, nifty_move_pct: -12.9805, iv_factor: 1.0729, days: 1}
    - {name: replay_2024-06-04, nifty_move_pct: -5.9294, iv_factor: 1.2775, days: 1}
    - {name: replay_2026-02-01, nifty_move_pct: -1.9557, iv_factor: 1.1079, days: 1}  # Feb 2026's largest fall
    - {name: replay_2026-02-03, nifty_move_pct: 2.5476, iv_factor: 0.9301, days: 1}   # Feb 2026's largest move
  # Design 6.2's daily stress line (story C5): a report on every card, not a limit. VIX +50% is an iv_factor of 1.5 on
  # every leg; "+5%" keeps volatility unchanged (response 105, question 1).
  stress_line:
    - {name: nifty_down_5pct_vix_up_50pct, nifty_move_pct: -5, iv_factor: 1.5, days: 1}
    - {name: nifty_down_5pct_vix_up_100pct, nifty_move_pct: -5, iv_factor: 2, days: 1}
    - {name: nifty_down_10pct_vix_up_50pct, nifty_move_pct: -10, iv_factor: 1.5, days: 1}
    - {name: nifty_down_10pct_vix_up_100pct, nifty_move_pct: -10, iv_factor: 2, days: 1}
    - {name: nifty_up_5pct, nifty_move_pct: 5, iv_factor: 1, days: 1}
  # Initial margin (SPAN plus exposure) per structure, width and lot, with source and date; older than the profile's
  # margin age, or missing, refuses the trade.
  margins:
    file: research/data/margins/margins.csv
    # Story A14 criterion 1 (judge 77): NSE SPAN rows are written only after an independent broker check of the job's
    # figures passed. 14 Oct 2026: Groww's SPAN equals the row's to the rupee and its exposure equals NSE's rule to the
    # paisa on the same index base (claims response 77, "Broker check 2"); the judge decides whether this meets it.
    # Story STR1b: one approval per structure code (a check covers the codes it compared). The 14 Oct check compared
    # SF, SC and BF rows only; a new code is added with its own check's source and date.
    nse_span_check:
      SF: {source: "Groww margin API (read-only), orchestrator run", passed_on: 2026-10-14}
      SC: {source: "Groww margin API (read-only), orchestrator run", passed_on: 2026-10-14}
      BF: {source: "Groww margin API (read-only), orchestrator run", passed_on: 2026-10-14}
  # One frozen stressed-margin method: multiplier (k from factor_file; a row expires after max_age_days) or
  # scenario_lookup (scenario_file: a margin per scenario above). k multiplies the whole margin, scan and exposure
  # (owner, 15 Oct 2026; story C2c). Story C2d: k is never in this file. C2 and C4 read the latest row of factor_file
  # dated before the decision day; A14c's weekly job appends it (owner, 15 Oct 2026: automatic, with an alert; a rise
  # applies at once, any fall waits for the owner; DESK_DECISIONS da0f769d). The first row is the owner's 1.45 of
  # 14 Oct 2026 (response 77, by hand), valid through 13 Nov 2026.
  stressed_margin:
    method: multiplier
    factor_file: research/data/margins/stress_factor.csv
    max_age_days: 30
    # Story A14c: downloads of archived SPAN files running ahead of the recompute (one Drive stream gave 0.41 MB/s on
    # 16 Oct 2026, about 30 s a file; parallel streams were each as fast). The order the files are read never changes.
    recompute_workers: 8

# Story E6: the paper review rule's statistics, in one place. PROVISIONAL until S1 (the evaluation protocol) freezes the
# real statistics; S1 replaces these values here, with no code change (orchestrator, 14 Oct 2026; reasoning only).
# The paper gate (20 completed positions, 3 months) is design 6's, shared with D2 in fno/constants.py.
# A review never promotes to real money by itself: that is always the owner's decision.
scorecard_review:
  status: provisional until S1
  confidence: 0.95  # two-sided interval of the mean net per completed position
  bootstrap_resamples: 10000
  bootstrap_seed: 20261014

# Story E3: the paper desk's daily timetable (IST). PROPOSED, not frozen: S1 calibrates the times from measured run
# times and freezes them in the evaluation protocol. The pack waits for the 3 pm canonical snapshot (14:55-15:10, judge
# 72); decisions are collected at the deadline; the execution snapshot is a second recorder capture; fills and exits
# finish by `fills_by`. The account lock lease covers one book's write inside the fills window, not E1's 600 seconds.
desk:
  timetable:
    status: proposed until S1
    pack: "14:58"  # first try; retried until `pack_wait_until` while the canonical snapshot is not committed yet
    pack_wait_until: "15:10"  # the recorder's window end: no canonical snapshot by then means no pack today
    decision_deadline: "15:12"
    execution_snapshot: "15:15"
    fills_by: "15:23"  # GW1: E3 asks from 15:17:00 (A16's 15:15 quiet window); 2m57s + a 60 s 429 pause + 60 s
    lock_lease_seconds: 60

# Story BG1: the monthly AI budget. Decided by the owner on 15 Oct 2026 (docs/DESK_DECISIONS.md, "Monthly AI budget
# accepted"): AI routine use for books and roles capped at half of the plan's measured session minutes, alert at 80%,
# AI roles stop at 100% while code jobs keep running. The plan publishes no minutes allowance, so the cap is 50% of all
# measured session minutes of the month until `measured_basis_until`; then `plan_minutes_per_month`, the owner's fixed
# figure from real data (owner, 15 Oct 2026, "7 A": "50% of measured minutes for two months, then a fixed monthly
# figure"; two months from the decision taken as November and December 2026, October being partial: the
# orchestrator's decision while the owner was away, response 113; the owner may change it).
# `v4_freeze_date` is protocol v4's freeze day once it exists (G6); empty means "projected".
budget:
  # Owner, 24 Oct 2026 (DESK_DECISIONS "No monthly AI budget cap: unlimited"): "No monthly budget cap for AI. Keep it
  # unlimited." BG1 records and reports minutes; nothing alerts or stops (story BG1-u). `share` would bring back the 15
  # Oct cap below; its five settings are unused while `cap: none`, kept for a later decision.
  cap: none
  books_and_roles_share_pct: 50
  alert_pct: 80
  stop_pct: 100
  measured_basis_until: "2026-12"
  plan_minutes_per_month: null  # owed by the owner after measured_basis_until; never set by a builder
  # The plan's decided monthly cost, applied to every month from `from_month` until a newer decision row changes it
  # (judge 104 addendum 1; the orchestrator's reading of the owner's row, response 113). A recorded payment row in
  # accounting/operating_costs.csv is that month's cash spend; the meter flags it when it differs.
  plan_cost:
    rs_per_month: 20000
    from_month: "2026-10"
    decision: "DESK_DECISIONS 15 Oct 2026: Claude plan cost: INR 20,000 a month"
  # Data routines run by a Claude routine, each with its real schedule; each run's self-timed record is needed before the
  # measured level is known (judge 104 addenda 1-2). The 3 pm recorder is started every calendar day at about 14:50
  # IST (CLAUDE.md), closed days included. Writing that record is a change to the routine's prompt: the owner's step.
  data_routines:
    - name: "3 pm quote recorder"
      schedule: daily
  stop_rule:
    v4_freeze_date: null
    projected_v4_freeze_month: "2026-11"  # design v2 section 8.2: "if v4 freezes in early November 2026"

# Story O1: the daily run's own steps (`python -m fno daily run`) start live only from these dates (YYYY-MM-DD); null:
# not live, the step is recorded `not_live`. Set by the owner or a freeze, never by the run (a first live weather
# record ends M1's back-fill; live v4 rows made on or before the G6 freeze's `Frozen on:` day are never counted).
daily:
  live_from:
    margin_check: null  # A14c's `margins stress-broker-check`: set when its code lands
    weather: "2026-10-22"  # owner, 21 Oct 2026 (response 299 item 15): on before the v4 freeze, routine at 14:05
    forecasts_v4: "2026-10-22"  # the same; G7's rule forecasts, uncounted until the day after `Frozen on:`
    # G11: the AI books' own v4 go-live (the v4 AI fire runs and the v2 AI fire stops from it), never forecasts_v4's
    # date; null until the v4 freeze, the AI slots' registration and the routines' steps 3-4 (F1-G5-owner-checklist.md)
    ai_books_v4: "2026-10-26"
    v4_pack: "2026-10-26"  # G10: the `v4` capture (part starts 14:29, captures from 14:32), the release by 14:45, the 15:10 check (owner, 24 Oct)
    forecasts_v4_pack: "2026-10-26"  # G7b completion: the pack-derived v4 rows after the release (owner, 24 Oct)
    card: "2026-10-26"  # T1's daily card to #fno-desk (owner, 24 Oct: "enable/activate everything that has been completed")
    price_distribution: "2026-10-22"  # story G13's valuation record and price-distribution forecasts
    price_distribution_scores: "2026-10-22"  # G13's daily `pricedist score` (the previous sessions' outcomes)
    price_ranges: "2026-10-22"  # story G13b's 15:45 NIFTY and BANKNIFTY ranges
    price_range_scores: "2026-10-22"  # G13b's daily `pricerange score` and seals; the same one-session lag
    premium_ranges: "2026-10-23"  # story G13d's next-session 3 pm premium ranges (judge 465.2 PASS; merged 22 Oct evening)
    premium_range_scores: "2026-10-26"  # G13d's daily `premrange score` and seals (owner, 24 Oct: the same)
    close_read: "2026-10-23"  # story A4h's 15:40 close read: record-only for its first 5 sessions (orchestrator)
    close_recheck: "2026-10-23"  # A4h's 16:00 second read
    recommend: "2026-10-26"  # story REC1b: the recommender's daily record and #fno-desk line (owner: every built feature on)
    # Story F1t: each AI book's first trading day (null: the book is not in the desk at all). Set by the owner only,
    # after the go-live checks in docs/stories/F1t-ai-trading-runner.md.
    book2_hybrid: null
    book3_ai: null

# Story F1t: the AI books' decision timetable, proposed until S1 freezes it from measured run times (like
# desk.timetable). A fire starting after latest_fire is not sent; a commitment counts only if on the remote at
# receipt_deadline; the routine reveals from reveal_from; a reveal counts only if on the remote at reveal_deadline,
# which must be before desk.timetable.decision_deadline (the promotion deadline).
ai_books:
  decision_timing:
    status: proposed until S1
    latest_fire: "15:07:00"
    receipt_deadline: "15:10:00"
    reveal_from: "15:10:10"
    reveal_deadline: "15:11:00"

# Story FL1-1d: the forecast lab's two report editions to #fno-forecast, each from its own owner routine (`lab open`
# at 08:38 IST, `lab close` at 19:53 IST), live only from these dates; null: not live (design signed off: DESK_DECISIONS
# 11ef1b23).
forecast_lab:
  live_from:
    morning: "2026-10-23"  # orchestrator, 22 Oct: live from Fri 23 Oct, with the owner's two scheduled tasks
    evening: "2026-10-23"

# Story O8: the daily health check reads the sessions dated from `window_days` days before its run's IST date up to
# that date (judge 164). The receipt search reads GitHub's log back to each commit's date (story receipts-reach).
health:
  window_days: 6
  # Story O8b: one line, once per calendar version, when NSE's calendar ends within this many days
  calendar_horizon_days: 45
# Story MS-P1a: the market school pilot (docs/stories/MS-market-school.md). Its own switches, apart from the desk's and
# v4's: `enabled` gates every paper decision, `reports` the 08:50 and 20:05 sections; both stay off until the
# orchestrator turns them on. The limits are the school's own copy of today's values (response 325 section 9.1,
# DESK_DECISIONS "Market school pilot: report sections and brake"), so a desk change never moves the pilot mid-count.
school:
  enabled: true
  reports: true
  first_counted:            # set from the frozen comparison card (MS-P1h) before the first counted session
  account_rs: 2000000       # each driver version's paper account
  max_loss_rs: 10000        # one trade, every charge and pad included
  daily_stop_rs: 25000      # loss since the previous slot that stops new entries for the session
  brake_rs: 120000          # equity this far below its high: no new trades until a monthly review row lifts it
  max_new_trades_per_slot: 5
  bucket_rs: 30000
  open_risk_rs: 150000
  new_risk_day_rs: 50000
