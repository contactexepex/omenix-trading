[pytest]
# Run in parallel with `python -m pytest -q -n auto` (pytest-xdist). `loadgroup` keeps each `xdist_group` on one worker:
# the PostgreSQL tests share one throwaway server and pick its ports one at a time (tests/market_read_models).
# `data` tests (story O9b) read data moved to Drive from the verified cache only: they run with `-m data` after
# `python -m fno data-cache sync <prefix>` (data-checks.yml), never in the default run.
addopts = --dist loadgroup -m "not data"
markers =
    data: reads data moved to Drive, from the verified cache (run `python -m fno data-cache sync <prefix>` first)
