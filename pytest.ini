[pytest]
# `fno` is imported from the repo root (no install), so keep the root on the import path whatever the invocation.
pythonpath = .
testpaths = tests
# Run in parallel with `python -m pytest -q -n auto` (pytest-xdist). `loadgroup` keeps each `xdist_group` on one worker:
# the PostgreSQL tests share one throwaway server and pick its ports one at a time (tests/market_read_models).
# `data` tests (story O9b) read data from the verified cache only: they run with `-m data` (data-checks.yml), never
# in the default run. The ingestion suite's `data` tests build that cache from fixtures under tmp_path (see
# tests/ingestion/test_drive_cache.py), so `pytest -m data` is meaningful offline, with no Drive call.
addopts = --dist loadgroup -m "not data"
markers =
    data: reads data from the verified cache (ingestion suite builds a temp cache from fixtures; no live Drive)
